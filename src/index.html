<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do</title>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-top">
            <div class="logo-container">
                <img class="sidebar-logo" src="assets/sidebar-logo.png">
                <h1>TODO</h1>
            </div>
            <button id="new-project-btn">+ New project</button>
        </div>

        <div class="sidebar-bottom">
            <h2>YOUR PROJECTS</h2>
            <div class="projects-container">
                <div class="project">
                    <div>
                        <img class="project-list-marker" src="assets/project-list-marker.svg">
                        <p class="project-name">My Project</p>
                    </div>
                    <button class="project-edit-btn">...</button>
                </div>
                <div class="project">
                    <div>
                        <img class="project-list-marker" src="assets/project-list-marker.svg">
                        <p class="project-name">My Project</p>
                    </div>
                    <button class="project-edit-btn">...</button>
                </div>
                <div class="project">
                    <div>
                        <img class="project-list-marker" src="assets/project-list-marker.svg">
                        <p class="project-name">My Project</p>
                    </div>
                    <button class="project-edit-btn">...</button>
                </div>
                <div class="project">
                    <div>
                        <img class="project-list-marker" src="assets/project-list-marker.svg">
                        <p class="project-name">My Project</p>
                    </div>
                    <button class="project-edit-btn">...</button>
                </div>
            </div>
        </div>
    </div>

    <main>
        <div class="project-info">
            <div class="project-title-container">
            <img src="assets/work.svg">
            <h1 class="project-title-name">My Project</h1>
            </div>
            <p class="project-title-description">Some Description</p>
        </div>
        <div class="status-buttons">
            <button class="all-btn">All</button>
            <button class="active-btn">Active</button>
            <button class="completed-btn">Completed</button>
        </div>
        <div class="task-container">
            <h2>Tasks</h2>
            <div class="task">
                <button id="task-complete-btn">Complete</button>

                <p class="task-title">Suspendisse quis</p>
                <p class="task-description">Nunc convallis arcu vel auctor accumsan.</p>

                <div class="task-date-container">
                    <img src="assets/calendar-month.svg">
                    <span id="task-date"></span>
                </div>

                <div class="task-priority"></div>
                <button id="task-delete-btn"></button>
            </div>
        </div>
        <div class="add-task-container">
            <h2>Add a New Task</h2>
            <form id="add-task-form">
                <div>
                    <label for="input-task-title" required>Name</label>
                    <input type="text" id="input-task-title">
                </div>
                <div>
                    <label for="input-task-description">Description</label>
                    <textarea id="input-task-description"></textarea>
                </div>
                <div>
                    <label for="input-task-date">Deadline</label>
                    <input type="date" id="input-task-date">
                </div>
                <div>
                    <label for="input-task-priority">Priority</label>
                    <select id="input-task-priority" required>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
            </form>
            <button id="add-task-btn">+ Add Task</button>
        </div> <!-- add modal or dialog here -->
    </main>
</body>

</html>
