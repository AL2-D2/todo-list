<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do</title>
</head>

<body>
    <div class="project-creator-container">
        <div class="sidebar-top">
            <img class="sidebar-logo" src="assets/sidebar-logo.png">
            <button>+ New project</button>
        </div>

        <div class="sidebar-bottom">
            <h1>YOUR PROJECTS</h1>   
            <div class="projects-container">
                <div class="project">
                    <img src="assets/arrow-right.svg">
                    <p class="project-name">My Project</p>
                    <button class="project-edit-btn"></button>
                </div>
            </div>         
        </div>
    </div>

    <div class="project-container">
        <div class="project-info"></div>
        <div class="status-buttons"></div>
        <div class="task-container"></div>
        <div class="add-task-container"></div>
    </div>
</body>

</html>
